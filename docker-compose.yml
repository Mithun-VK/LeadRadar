services:
  postgres:
    # Pinned to 16 for local development. Nothing in the schema or queries needs
    # 17, and 16-alpine is far more likely to be cached already. Production can
    # run any supported major version — override with POSTGRES_IMAGE if you want
    # to match your deployment target exactly.
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: leadradar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: leadradar
      POSTGRES_PASSWORD: leadradar
      POSTGRES_DB: leadradar
    # Host port is 5433 by default, not 5432: a developer machine very often
    # already runs a local PostgreSQL on 5432, and a second listener on the same
    # port produces a confusing authentication failure rather than a bind error.
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - leadradar-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U leadradar -d leadradar']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: leadradar-redis
    restart: unless-stopped
    # BullMQ requires keyspace eviction to be disabled: evicting queue keys
    # silently loses jobs. maxmemory-policy noeviction is mandatory, not a tuning choice.
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    # 6380 for the same reason as Postgres above.
    ports:
      - '${REDIS_PORT:-6380}:6379'
    volumes:
      - leadradar-redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # -------------------------------------------------------------------------
  # Application tiers.
  #
  # Both live under the `app` profile and are NOT started by a bare
  # `docker compose up`. The default developer loop is `npm run dev` against
  # containerised Postgres and Redis, which gives hot reload; starting a built
  # image alongside it would bind the same port and produce a confusing conflict.
  #
  #   docker compose up -d                      # datastores only (default)
  #   docker compose --profile app up -d --build  # full stack
  # -------------------------------------------------------------------------
  web:
    profiles: ['app']
    build:
      context: .
      target: web
    container_name: leadradar-web
    restart: unless-stopped
    env_file: [.env]
    environment:
      # Service names, not localhost: inside the compose network these resolve to
      # the containers, and the ports are the internal ones rather than the
      # remapped host ports above.
      DATABASE_URL: postgresql://leadradar:leadradar@postgres:5432/leadradar?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    profiles: ['app']
    build:
      context: .
      target: worker
    container_name: leadradar-worker
    restart: unless-stopped
    # PID 1 that reaps zombies and forwards SIGTERM, so the graceful drain in
    # src/workers/index.ts actually runs on `docker compose stop`.
    init: true
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://leadradar:leadradar@postgres:5432/leadradar?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # Long enough for an in-flight page fetch to finish. The default 10s would
    # cut a scrape short and leave the job to be retried at another credit's cost.
    stop_grace_period: 40s

volumes:
  leadradar-pgdata:
  leadradar-redisdata:
